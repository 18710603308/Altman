spring.application.name=qwen-mcp-agent
server.port=8080

# Qwen API configuration - adjust these to match your local Qwen3 setup
qwen.api.url=http://localhost:8000/v1
qwen.api.key=EMPTY
qwen.model.name=qwen3

# MCP Server URL for the client to connect to
mcp.server.url=http://localhost:8080/mcp/v1

# Logging
logging.level.com.ai.agent=DEBUG
logging.level.dev.langchain4j=INFO

# Spring AI settings (if using)
spring.ai.openai.base-url=${qwen.api.url}
spring.ai.openai.api-key=${qwen.api.key}
spring.ai.openai.chat.options.model=${qwen.model.name}

# Actuator endpoints
management.endpoints.web.exposure.include=health,info

# Baidu Map Configuration
baidu.map.api-key=YOUR_BAIDU_MAP_API_KEY
baidu.map.base-url=https://api.map.baidu.com
baidu.map.timeout=5000
